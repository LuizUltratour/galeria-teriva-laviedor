<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Vídeos — La Vie d'Or</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* La Vie d'Or — fundo marrom sólido #593B31 */
      --bg:            #593B31;
      --surface:       #6B493D;
      --dark:          #F2EBDD;
      --border:        rgba(242,235,221,0.12);
      --border-strong: rgba(242,235,221,0.28);
      --accent:        #F2EBDD;
      --accent-ink:    #593B31;
      --accent-soft:   rgba(242,235,221,0.14);
      --font-sans:     'Inter', system-ui, sans-serif;
      --ease:          cubic-bezier(0.4, 0, 0.2, 1);
      --spring:        cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--dark);
      font-family: var(--font-sans);
    }

    /* ── ROOT ── */
    #vg-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
    }

    /* ── HEADER ── */
    #vg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
    }
    #vg-logo { height: 48px; width: auto; display: block; }

    #btn-close, #vl-close {
      width: 45px; height: 45px;
      border: none;
      padding: 0;
      cursor: pointer;
      background: url(assets/close-normal.png) center/100% 100% no-repeat;
      flex-shrink: 0;
    }
    #btn-close:active, #vl-close:active { background-image: url(assets/close-hover.png); }
    @media (hover: hover) { #btn-close:hover, #vl-close:hover { background-image: url(assets/close-hover.png); } }

    /* ── GRID ── */
    #vg-scroll {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    #vg-scroll::-webkit-scrollbar { width: 5px; }
    #vg-scroll::-webkit-scrollbar-track { background: var(--bg); }
    #vg-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    #vg-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 14px;
    }
    @media (max-width: 1100px) { #vg-grid { grid-template-columns: repeat(2, 1fr); } }
    /* mobile: vídeos verticais, 2 por linha */
    #vg-grid.is-mobile { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 8px; }
    @media (max-width: 380px) { #vg-grid.is-mobile { grid-template-columns: 1fr; } }

    /* ── VIDEO CARD ── */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); filter: blur(4px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }

    .vg-card {
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
      cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 6px 20px rgba(0,0,0,0.28);
      animation: cardIn 0.55s var(--spring) both;
      transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease), border-color 0.4s var(--ease);
    }
    #vg-grid.is-mobile .vg-card { aspect-ratio: 9/16; }
    .vg-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 16px 38px rgba(0,0,0,0.42), 0 0 0 1px var(--accent-soft);
    }

    .vg-card video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .vg-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.18);
      transition: background 0.25s var(--ease);
    }
    .vg-card:hover .vg-play { background: rgba(0,0,0,0.35); }

    .vg-play-icon {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      display: flex; align-items: center; justify-content: center;
      transform: scale(0.85);
      transition: transform 0.3s var(--spring);
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }
    .vg-card:hover .vg-play-icon { transform: scale(1); }
    .vg-play-icon svg { margin-left: 3px; }

    .vg-card-info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 28px 14px 13px;
      background: linear-gradient(to top, rgba(33,23,16,0.92) 0%, rgba(33,23,16,0.45) 60%, transparent 100%);
      color: var(--dark);
    }
    .vg-card-title {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.3;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }

    /* ── LIGHTBOX ── */
    #vg-lightbox {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: flex;
      flex-direction: column;
      background: rgba(89,59,49,0.98);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #vg-lightbox.open { opacity: 1; pointer-events: auto; }

    #vl-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      flex-shrink: 0;
    }
    #vl-info { display: flex; flex-direction: column; gap: 3px; }
    #vl-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--dark);
      letter-spacing: 0.02em;
    }
    #vl-counter {
      font-size: 10px;
      color: rgba(242,235,221,0.4);
      letter-spacing: 0.06em;
    }

    #vl-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 80px;
      min-height: 0;
      position: relative;
    }

    #vl-player {
      max-width: 100%;
      max-height: 100%;
      background: #000;
      outline: none;
    }

    .vl-nav {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 45px; height: 45px;
      border: none;
      padding: 0;
      cursor: pointer;
      background-color: transparent;
      background-repeat: no-repeat;
      background-position: center;
      background-size: 100% 100%;
    }
    #vl-prev { left: 16px; background-image: url(assets/voltar-normal.png); }
    #vl-next { right: 16px; background-image: url(assets/proximo-normal.png); }
    #vl-prev:active { background-image: url(assets/voltar-hover.png); }
    #vl-next:active { background-image: url(assets/proximo-hover.png); }
    @media (hover: hover) {
      #vl-prev:hover { background-image: url(assets/voltar-hover.png); }
      #vl-next:hover { background-image: url(assets/proximo-hover.png); }
    }
    .vl-nav:disabled { opacity: 0.18; cursor: default; }

    #vl-foot { padding: 10px 28px; flex-shrink: 0; }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      #vg-header { padding: 10px 14px; }
      #vg-logo { height: 36px; }
      #vl-head { padding: 12px 14px; }
      #vl-body { padding: 0; }
      #vl-prev { left: 8px; }
      #vl-next { right: 8px; }
      #vl-foot { padding: 8px 14px; }
    }

    /* ── ACESSIBILIDADE / DESEMPENHO ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
      .vg-card { animation: none; filter: none; }
      .vg-card:hover { transform: none; }
    }
  </style>
</head>
<body>

<div id="vg-root">
  <header id="vg-header">
    <img id="vg-logo" src="assets/logo.png" alt="La Vie d'Or">
    <button id="btn-close" title="Fechar" aria-label="Fechar"></button>
  </header>

  <div id="vg-scroll">
    <div id="vg-grid"></div>
  </div>
</div>

<!-- Lightbox -->
<div id="vg-lightbox" role="dialog" aria-modal="true">
  <div id="vl-head">
    <div id="vl-info">
      <div id="vl-title"></div>
      <div id="vl-counter"></div>
    </div>
    <button id="vl-close" aria-label="Fechar"></button>
  </div>
  <div id="vl-body">
    <button id="vl-prev" class="vl-nav" aria-label="Anterior"></button>
    <video id="vl-player" controls playsinline preload="metadata"></video>
    <button id="vl-next" class="vl-nav" aria-label="Próximo"></button>
  </div>
  <div id="vl-foot"></div>
</div>

<script>
// ================================================================
// CONFIGURAÇÃO — vídeos de PC (assets/videos/) e de celular
// (assets/videos/VERTICAIS/). Só a lista do dispositivo é carregada.
// ================================================================
const VIDEOS_PC = [
  { title: 'Filme Conceito',               src: 'assets/videos/FILME CONCEITO 1.30s.mp4' },
  { title: 'Filme Produto 15s',            src: 'assets/videos/FILME PRODUTO 15s.mp4' },
  { title: 'Filme Produto 15s (Extendido)', src: 'assets/videos/FILME PRODUTO 15s (Extendido).mp4' },
  { title: 'Filme Produto 30s',            src: 'assets/videos/FILME PRODUTO 30s.mp4' },
  { title: 'Filme Produto 30s (Extendido)', src: 'assets/videos/FILME PRODUTO 30s (Extendido).mp4' },
  { title: 'Filme TV 30s',                 src: 'assets/videos/FILME TV 30s.mp4' },
];

const VIDEOS_MOBILE = [
  { title: 'Filme 15s — V1',        src: 'assets/videos/VERTICAIS/FILME 15s (Vertical) V1.mp4' },
  { title: 'Filme 15s — V2',        src: 'assets/videos/VERTICAIS/FILME 15s (Vertical) V2.mp4' },
  { title: 'Filme Produto 30s — V1', src: 'assets/videos/VERTICAIS/FILME PRODUTO 30s (Vertical) V1.mp4' },
  { title: 'Filme Produto 30s — V2', src: 'assets/videos/VERTICAIS/FILME PRODUTO 30s (Vertical) V2.mp4' },
  { title: 'Filme TV 30s',          src: 'assets/videos/VERTICAIS/FILME TV 30s (Vertical).mp4' },
];

const $ = id => document.getElementById(id);
const elGrid     = $('vg-grid');
const elLightbox = $('vg-lightbox');
const elPlayer   = $('vl-player');
const elPrev     = $('vl-prev');
const elNext     = $('vl-next');

// Celular = user agent móvel ou viewport estreito
const mqNarrow = window.matchMedia('(max-width: 700px)');
const isMobile = () => /Android.+Mobile|iPhone|iPod|Windows Phone/i.test(navigator.userAgent) || mqNarrow.matches;

let list = [];
let idx = -1;

const url = v => encodeURI(v.src);

function render() {
  const mobile = isMobile();
  list = mobile ? VIDEOS_MOBILE : VIDEOS_PC;
  elGrid.classList.toggle('is-mobile', mobile);
  elGrid.innerHTML = '';
  list.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = 'vg-card';
    card.style.animationDelay = Math.min(i * 0.05, 0.4) + 's';
    // #t=0.5 faz o navegador mostrar um quadro do vídeo como capa
    card.innerHTML =
      `<video src="${url(v)}#t=0.5" preload="metadata" muted playsinline></video>` +
      `<div class="vg-play"><div class="vg-play-icon"><svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M8 5v14l11-7z"/></svg></div></div>` +
      `<div class="vg-card-info"><div class="vg-card-title">${v.title}</div></div>`;
    card.addEventListener('click', () => openLb(i));
    elGrid.appendChild(card);
  });
}

// ── lightbox ─────────────────────────────────────────────────────
function openLb(i) {
  idx = i;
  play();
  elLightbox.classList.add('open');
  document.addEventListener('keydown', onKey);
}

function play() {
  const v = list[idx];
  $('vl-title').textContent = v.title;
  $('vl-counter').textContent = (idx + 1) + ' / ' + list.length;
  elPrev.disabled = idx === 0;
  elNext.disabled = idx === list.length - 1;
  elPlayer.src = url(v);
  elPlayer.play().catch(() => {});
}

function closeLb() {
  elLightbox.classList.remove('open');
  document.removeEventListener('keydown', onKey);
  elPlayer.pause();
  elPlayer.removeAttribute('src');
  elPlayer.load();
}

function nav(d) {
  const n = idx + d;
  if (n < 0 || n >= list.length) return;
  idx = n;
  play();
}

function onKey(e) {
  if (e.key === 'Escape')     closeLb();
  if (e.key === 'ArrowLeft')  nav(-1);
  if (e.key === 'ArrowRight') nav(1);
}

// ── fechar ──────────────────────────────────────────────────────
function closeGallery() {
  elPlayer.pause();
  if (window.parent !== window) {
    window.parent.postMessage({ action: 'closeGallery' }, '*');
  } else if (window.history.length > 1) {
    history.back();
  } else {
    window.close();
  }
}

$('btn-close').addEventListener('click', closeGallery);
$('vl-close').addEventListener('click', closeLb);
elPrev.addEventListener('click', () => nav(-1));
elNext.addEventListener('click', () => nav(1));

// Troca de lista se o dispositivo/tamanho mudar (ex.: rotação)
let lastMobile = isMobile();
mqNarrow.addEventListener('change', () => {
  if (isMobile() === lastMobile) return;
  lastMobile = isMobile();
  closeLb();
  render();
});

render();
</script>
</body>
</html>
